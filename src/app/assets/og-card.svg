<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Compass — Your Markdown. Beautifully Published.</title>
  <desc id="description">The blue Compass icon beside a Markdown document becoming a polished publication, on a pale blue canvas.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1">
      <stop stop-color="#f8faff"/>
      <stop offset="1" stop-color="#e8f0fc"/>
    </linearGradient>
    <linearGradient id="blue" x2="1" y2="1">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563eb" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#192b42" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#canvas)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1048" cy="281" r="212" fill="#2563eb" fill-opacity=".045"/>
  <circle cx="1048" cy="281" r="260" fill="none" stroke="#2563eb" stroke-opacity=".065"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(64 58)">
      <rect width="54" height="54" rx="15" fill="#2563eb"/>
      <g transform="scale(.84375)">
        <path d="M42 18.3a17 17 0 1 0 3.7 23.7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".65"/>
        <path d="m18 46 10-18 8 8Z" fill="#fff" opacity=".45"/>
        <path d="m46 18-10 18-8-8Z" fill="#fff"/>
      </g>
      <text x="70" y="37" font-size="36" font-weight="700" letter-spacing="-1.8" fill="#192b42">Compass</text>
    </g>
    <text x="64" y="204" font-size="13" font-weight="700" letter-spacing="2.4" fill="#2563eb">YOUR WORDS. YOUR PUBLICATION.</text>
    <g font-size="64" font-weight="700" letter-spacing="-3">
      <text x="60" y="288" fill="#192b42">Your Markdown.</text>
      <text x="60" y="365" fill="#192b42">Beautifully</text>
      <text x="60" y="442" fill="#2563eb">Published.</text>
    </g>
    <text x="64" y="492" font-size="21" fill="#67788e">Shape It. Preview It. Share It.</text>
    <g transform="translate(64 550)">
      <circle cx="5" cy="-5" r="4" fill="#0d9488"/>
      <text x="20" font-size="14" font-weight="600" fill="#53677f">Runs in Your Browser</text>
      <circle cx="181" cy="-5" r="2" fill="#9aaec7"/>
      <text x="196" font-size="14" font-weight="600" fill="#53677f">Works Offline</text>
    </g>
    <!-- Source document sits behind the finished publication. -->
    <g transform="translate(698 154) rotate(-9 160 160)">
      <rect width="294" height="330" rx="14" fill="#f8faff" stroke="#cfdbec" filter="url(#shadow)"/>
      <path d="M0 48H294" stroke="#dfe6ef"/>
      <circle cx="21" cy="24" r="4" fill="#b4c5dd"/>
      <text x="36" y="29" font-size="12" font-weight="600" fill="#67788e">field-notes.md</text>
      <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#67788e">
        <text x="24" y="88" fill="#2563eb"># A Fresh Perspective</text>
        <text x="24" y="124">Good ideas deserve</text>
        <text x="24" y="148">a place to land.</text>
        <text x="24" y="192" fill="#2563eb">## The Essentials</text>
        <text x="24" y="228">- Room to explore</text>
        <text x="24" y="252">- A little clarity</text>
        <text x="24" y="276">- Something to share</text>
      </g>
    </g>
    <g transform="translate(818 194) rotate(6 154 167)">
      <rect width="304" height="350" rx="15" fill="#fff" stroke="#d5e0ee" filter="url(#shadow)"/>
      <path d="M15 0H289Q304 0 304 15V53H0V15Q0 0 15 0Z" fill="url(#blue)"/>
      <text x="26" y="32" font-size="11" font-weight="700" letter-spacing="1.6" fill="#fff">FIELD NOTES</text>
      <path d="M252 22H278M252 28H278M252 34H270" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
      <text x="26" y="94" font-size="10" font-weight="700" letter-spacing="1.5" fill="#2563eb">IDEAS WORTH SHARING</text>
      <g font-size="28" font-weight="700" letter-spacing="-1" fill="#192b42">
        <text x="25" y="133">A Fresh</text>
        <text x="25" y="166">Perspective</text>
      </g>
      <text x="26" y="196" font-size="12" fill="#67788e">Good ideas deserve a place to land.</text>
      <path d="M26 218H278" stroke="#dfe6ef"/>
      <text x="26" y="247" font-size="15" font-weight="700" fill="#192b42">The Essentials</text>
      <g font-size="13" fill="#67788e">
        <text x="44" y="273">Room to explore</text>
        <text x="44" y="293">A little clarity</text>
        <text x="44" y="313">Something to share</text>
      </g>
      <g fill="#2563eb">
        <circle cx="29" cy="269" r="3"/><circle cx="29" cy="289" r="3"/><circle cx="29" cy="309" r="3"/>
      </g>
    </g>
    <g transform="translate(748 480)">
      <circle r="27" fill="#2563eb" stroke="#f2f6fd" stroke-width="6"/>
      <path d="M-9 0H9M2-7 9 0 2 7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
