<svg xmlns="http://www.w3.org/2000/svg" width="630" height="630" viewBox="0 0 630 630" role="img" aria-labelledby="title description">
  <title id="title">Compass — Your Markdown. Beautifully Published.</title>
  <desc id="description">A square Compass card with the blue compass icon, a large Compass wordmark, and the headline Your Markdown. Beautifully Published.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1">
      <stop stop-color="#f8faff"/>
      <stop offset="1" stop-color="#e8f0fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563eb" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="630" height="630" fill="url(#canvas)"/>
  <rect width="630" height="630" fill="url(#grid)"/>
  <circle cx="630" cy="315" r="265" fill="#2563eb" fill-opacity=".025"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(50 72)">
      <rect width="80" height="80" rx="22" fill="#2563eb"/>
      <g transform="scale(1.25)">
        <path d="M42 18.3a17 17 0 1 0 3.7 23.7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".65"/>
        <path d="m18 46 10-18 8 8Z" fill="#fff" opacity=".45"/>
        <path d="m46 18-10 18-8-8Z" fill="#fff"/>
      </g>
      <text x="100" y="63" font-size="70" font-weight="700" letter-spacing="-3.5" fill="#192b42">Compass</text>
    </g>
    <g font-size="72" font-weight="700" letter-spacing="-3">
      <text x="46" y="286" fill="#192b42">Your Markdown.</text>
      <text x="46" y="376" fill="#192b42">Beautifully</text>
      <text x="46" y="466" fill="#2563eb">Published.</text>
