name: Checks and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up PNPM and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install JavaScript renderer and build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build app and previews and run checks
        run: pnpm run check
      - name: Upload GitHub Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
